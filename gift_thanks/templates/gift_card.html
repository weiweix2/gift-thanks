<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 本地打包字体；加载失败则走系统字体兜底 */
  @font-face {
    font-family: 'Noto Sans SC';
    src: url('fonts/NotoSansSC-Regular.otf') format('opentype');
    font-weight: 400;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 200px; overflow: hidden; }
  body {
    font-family: 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    background: transparent;
  }
  .card {
    width: 780px; height: 180px; margin: 10px;
    background: #fdf6ec;                     /* 奶油色底 */
    border-radius: 24px;
    border: 2px solid #f0dfc8;
    box-shadow: 0 6px 18px rgba(190, 150, 100, .18);
    display: flex; align-items: center;
    padding: 0 28px;
    position: relative;
    overflow: hidden;
  }
  .card::before {                            /* 左上角柔和装饰圆 */
    content: ''; position: absolute;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(245, 205, 160, .25);
    left: -50px; top: -60px;
  }
  .face {
    width: 110px; height: 110px; border-radius: 22px;
    object-fit: cover; flex: none;
    border: 3px solid #ffffff;
    box-shadow: 0 3px 8px rgba(180, 140, 95, .25);
    background: #f0e6da;
  }
  .mid { flex: 1; min-width: 0; margin-left: 22px; }
  .uname {
    font-size: 30px; font-weight: 700; color: #6b5136;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 380px;
  }
  .kind {
    display: inline-block; margin-top: 6px;
    font-size: 18px; color: #a9805a;
    background: #f7e8d4; border-radius: 999px;
    padding: 3px 14px;
  }
  .time { margin-top: 8px; font-size: 18px; color: #b39b80; }
  .right { flex: none; margin-left: 20px; text-align: right; display: flex; align-items: center; }
  .gift-img {
    width: 96px; height: 96px; object-fit: contain;
    border-radius: 18px; background: #fffdf8;
    border: 2px solid #f3e3cd;
  }
  .gift-info { margin-left: 18px; text-align: left; }
  .gift-name {
    font-size: 26px; font-weight: 700; color: #c07a3e;
    max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gift-num { font-size: 20px; color: #8a6d4e; margin-top: 2px; }
  .rmb { font-size: 24px; font-weight: 700; color: #d96f4e; margin-top: 4px; }
  .rmb.free { color: #8fa878; }
  .sc-msg {
    margin-top: 6px; font-size: 18px; color: #8a6d4e;
    max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="face" src="{{ face_src }}" alt="">
    <div class="mid">
      <div class="uname">{{ uname }}</div>
      <div class="kind">{{ kind_label }}</div>
      {% if sc_message %}<div class="sc-msg">{{ sc_message }}</div>{% endif %}
      <div class="time">{{ time_str }}</div>
    </div>
    <div class="right">
      <img class="gift-img" src="{{ gift_img }}" onerror="this.onerror=null;this.src='{{ placeholder_gift }}';" alt="">
      <div class="gift-info">
        <div class="gift-name">{{ gift_name }}</div>
        <div class="gift-num">× {{ num }}</div>
        {% if is_free %}
          <div class="rmb free">免费礼物</div>
        {% else %}
          <div class="rmb">¥ {{ rmb }}</div>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
